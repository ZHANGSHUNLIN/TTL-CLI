name: Release

on:
  push:
    tags:
      - 'v*'

env:
  GO_VERSION: '1.25'

permissions:
  contents: write

jobs:
  build-client:
    name: Package client (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Download dependencies
        run: go mod download
      - name: Build and package client
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          version="${GITHUB_REF#refs/tags/}"
          output="ttl"
          extension="tar.gz"
          if [ "$GOOS" = "windows" ]; then output="ttl.exe"; extension="zip"; fi
          archive="ttl-${version}-${GOOS}-${GOARCH}.${extension}"
          go build -ldflags="-s -w" -o "$output" ./cmd/ttl
          if [ "$extension" = "zip" ]; then zip "$archive" "$output"; else tar czf "$archive" "$output"; fi
          sha256sum "$archive" > "$archive.sha256"
      - name: Upload client package
        uses: actions/upload-artifact@v4
        with:
          name: client-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ttl-*

  build-server:
    name: Package server (linux/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Download dependencies
        run: go mod download
      - name: Build and package server
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          version="${GITHUB_REF#refs/tags/}"
          output="ttl-server"
          archive="ttl-server-${version}-linux-${GOARCH}.tar.gz"
          staging="staging"
          mkdir -p "$staging"
          go build -ldflags="-s -w" -o "$staging/$output" ./cmd/ttl-server
          tar czf "$archive" -C "$staging" "$output"
          sha256sum "$archive" > "$archive.sha256"
          tar tzf "$archive" | grep -Fx "$output"
          if tar tzf "$archive" | grep -Ev '^ttl-server$'; then
            echo "server archive contains an unexpected file"
            exit 1
          fi
      - name: Upload server package
        uses: actions/upload-artifact@v4
        with:
          name: server-linux-${{ matrix.goarch }}
          path: ttl-server-*

  publish:
    name: Publish release
    needs: [build-client, build-server]
    runs-on: ubuntu-latest
    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate release notes
        id: release-notes
        run: |
          version="${GITHUB_REF#refs/tags/}"
          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          echo "## ${version}" >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "客户端和服务端制品已分别构建并附带 SHA-256 校验文件。" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.release-notes.outputs.body }}
          files: dist/*
          draft: false
          prerelease: false
          generate_release_notes: false
